    <h1>Image Gallery</h1>

      background-color: gray;
      display: flex;
      align-items: center;
      justify-content: center;
      background-size: cover;
      color: #ffff;
      font-size: 2em;
      text-align: center;
      margin: 10px;
    ">
      Hover over an image below to display here
    </div>

    <div class="grid-gallery">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwPNWk0sEemKWHOdp6qlOPvREH3jGPM7ejGw&s" alt="Image base64" />
